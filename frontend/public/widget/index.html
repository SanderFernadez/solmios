<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservá Directo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="booking-widget" class="max-w-4xl mx-auto p-4">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Reservá al mejor precio</h1>
      <p class="text-gray-500 text-sm mt-1">Precio garantizado — Sin comisiones ocultas</p>
    </div>

    <!-- Search Form -->
    <div id="search-form" class="bg-white rounded-xl shadow-lg p-6 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Check-in</label>
          <input type="date" id="checkin" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Check-out</label>
          <input type="date" id="checkout" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Huéspedes</label>
          <select id="adults" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            <option value="1">1 adulto</option>
            <option value="2" selected>2 adultos</option>
            <option value="3">3 adultos</option>
            <option value="4">4 adultos</option>
          </select>
        </div>
        <div class="flex items-end">
          <button id="search-btn" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
            Buscar
          </button>
        </div>
      </div>
      <div class="mt-3 flex items-center gap-2">
        <input type="text" id="promo-code" placeholder="Código promocional (opcional)" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-8">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600"></div>
      <p class="mt-2 text-gray-500">Buscando disponibilidad...</p>
    </div>

    <!-- Error -->
    <div id="error" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
      <p class="text-red-700 text-sm" id="error-message"></p>
    </div>

    <!-- Results -->
    <div id="results" class="hidden">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Habitaciones disponibles</h2>
      <div id="room-list" class="space-y-4"></div>
    </div>

    <!-- Booking Form (hidden by default) -->
    <div id="booking-form" class="hidden bg-white rounded-xl shadow-lg p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Completá tus datos</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo *</label>
          <input type="text" id="guest-name" class="w-full border border-gray-300 rounded-lg px-3 py-2" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input type="email" id="guest-email" class="w-full border border-gray-300 rounded-lg px-3 py-2" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono *</label>
          <input type="tel" id="guest-phone" class="w-full border border-gray-300 rounded-lg px-3 py-2" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Niños</label>
          <select id="children" class="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </div>
      </div>
      <div class="mt-6 flex gap-3">
        <button id="cancel-booking" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancelar</button>
        <button id="confirm-booking" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2 px-4 rounded-lg">Confirmar y Pagar</button>
      </div>
    </div>

    <!-- Booking Confirmation -->
    <div id="booking-confirmation" class="hidden bg-green-50 border border-green-200 rounded-xl p-6 text-center">
      <div class="text-green-600 text-4xl mb-3">✓</div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">¡Reserva confirmada!</h2>
      <p class="text-gray-600 mb-4">Recibirás un email de confirmación en breve.</p>
      <div id="confirmation-details" class="bg-white rounded-lg p-4 text-left text-sm"></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="ga4.js"></script>
  <script src="booking.js"></script>
</body>
</html>
