external_dependencies:
  whatsapp_business:
    status: not_configured
    required_for: [phase-6-whatsapp-funnel]
    docs: https://developers.facebook.com/docs/whatsapp
    shared_blocker: true
    notes: Mismo blocker que match-misterplan/phase-7-whatsapp. Desbloquear creds Meta libera AMBOS.
  stripe:
    status: partial
    required_for: [phase-5-thank-you-page]
    docs: https://stripe.com/docs/api
    notes: |
      Stripe está conectado en el PMS (deposits, payment-links, checkout sessions)
      pero NO existe el producto "Programa Hotel Fundador" como Price. Crear Price
      en Stripe dashboard y mapear plan→priceId en configuration.
  meta_pixel:
    status: not_configured
    required_for: [phase-7-marketing-tags]
    notes: Requiere Pixel ID de Meta Events Manager.
  ga4:
    status: not_configured
    required_for: [phase-7-marketing-tags]
    notes: Requiere Measurement ID (G-XXXXXXX).

