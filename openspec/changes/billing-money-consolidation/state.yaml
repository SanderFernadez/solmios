motivation: |
  Reproducido en local: un cobro en efectivo desde /panel/billing no entra al arqueo de caja
  ni a la conciliación bancaria. `facturas.pay()` escribe un comprobante dentro de `invoices`
  en vez de registrar un pago en `payments`, que es la tabla conectada a caja.

