hallazgos:
  H1:
    sev: critica
    file: "modules/payments/index.ts:77-80"
    tipo: multi-tenancy
    desc: cobro con tarjeta usa process.env.STRIPE_SECRET_KEY (cuenta global, no la del hotel)
  H2:
    sev: critica
    file: "modules/bookingengine/index.ts:72-75"
    tipo: multi-tenancy
    desc: motor de reservas público usa la misma cuenta global del .env
  H3:
    sev: alta
    file: "kernel/http/server.ts:201"
    tipo: framework
    desc: rawBody descartado → ninguna firma de webhook puede verificarse
  H4:
    sev: media
    file: "modules/payments/usecases/deposits.ts:33"
    tipo: feature-falsa
    desc: "stripePaymentId: '' hardcodeado — la garantía no es una retención real"
  H5:
    sev: media
    file: "payments|folios|facturas|cash|hoteles|payroll|gastos/types.ts"
    tipo: duplicacion
    desc: 8 enums distintos de método de pago
  H6:
    sev: media
    tipo: duplicacion
    desc: StripeUseCase duplicada en payments y bookingengine, con apiVersions distintas
          (2026-05-27.dahlia vs 2025-08-27.basil)

proveedores:
  stripe:   { webhook: firmado-hmac, refund: si, sdk_node: si, estado: a-migrar }
  paypal:   { webhook: firmado-rsa,  refund: si, sdk_node: si, estado: por-hacer }
  azul_pp:  { webhook: NO, confirmacion: return-hash-sha512, refund: NO, sdk_node: no, estado: por-hacer }
  azul_ws:  { webhook: NO, confirmacion: sincrona, refund: si, mtls: si, estado: fuera-de-scope }
  cardnet:  { estado: BLOQUEADO, motivo: "doc pública expone 2 plataformas con auth incompatibles (Ztrans vs tokenización); requiere confirmar contrato real con el ejecutivo de cuenta" }

