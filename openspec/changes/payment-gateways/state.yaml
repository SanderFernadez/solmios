# SDD State: payment-gateways

change_name: payment-gateways
created: 2026-07-14
status: proposed
current_phase: design
parent_changes: [seguridad-multitenant]
trigger: >
  El dueño pidió que la integración de pagos tenga página propia y soporte varios proveedores
  (incluidos bancos locales RD), señalando que la configuración es de CADA hotel, no de la
  plataforma. La auditoría confirmó el problema de fondo: 2 de los 3 flujos de Stripe
  (payments, bookingengine) resuelven las llaves desde process.env — una cuenta global para
  todos los hoteles. Con dos hoteles con llaves cargadas, la plata de uno puede cobrarse en la
  cuenta del otro. Hoy no explota solo porque las vars del .env de prod están vacías.

