# SDD State: restaurante-pos

change_name: restaurante-pos
created: 2026-07-23
status: done   # los 9 sprints (res-0..res-8) están done — desplegado en prod (RES-0..RES-8, 2026-07-23)
current_phase: archived
closed: 2026-07-28
parent_changes: []

motivation: |
  POS de restaurante completo (carta + mesas + comandas + KDS + cuenta/split/propina + cargo a habitación
  o cobro directo + cierre de caja), IN-HOUSE, integrado por conectores a la infraestructura financiera
  existente (folios = cargo a habitación, payments = cobro, accounting = asiento, cash = arqueo). NO duplica
  la fuente de verdad del dinero: una venta se cuenta UNA vez (o folio o payment, nunca ambos).

architecture_decision: in-house-pos-completo   # POS completo con KDS, confirmado con el dueño.

scope:
  restaurant: [estaciones-configurables, carta-menu, ruteo-categoria-estacion, mesas-salon, comandas, kds-cocina, cuenta-split-propina, cargo-a-folio, cobro-directo, contabilidad-pos, frontend]
  reuse: [folios.postCharge, payments.createPayment, folios-accounting, payments-accounting, cash-caja, configuration-taxes]
  out_of_scope: [inventario-food-cost, compras-proveedor-restaurante, reserva-mesa-online, delivery-terceros, impresion-termica-hardware, multi-moneda]

