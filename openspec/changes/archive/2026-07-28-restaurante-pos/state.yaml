rollback: |
  Módulo aditivo y aislado: desregistrar RestaurantModule + 2-3 conectores en composition-root.ts y dropear
  las 6 tablas nuevas no toca ninguna tabla financiera existente. Conectores best-effort (un asiento que falla
  no afecta el cobro/cargo real). Se apaga por entitlement de plan sin desplegar.

